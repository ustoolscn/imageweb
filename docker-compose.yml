services:
  image-web:
    build: .
    container_name: image-web
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN is required}
      APP_CREDENTIAL_KEY: ${APP_CREDENTIAL_KEY:?APP_CREDENTIAL_KEY is required}
      OSS_REGION: ${OSS_REGION:?OSS_REGION is required}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:?OSS_PUBLIC_BASE_URL is required}
      OSS_PREFIX: ${OSS_PREFIX:-imageweb}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}
      GALLERY_ADMIN_USERNAME: ${GALLERY_ADMIN_USERNAME:-admin}
      GALLERY_ADMIN_PASSWORD: ${GALLERY_ADMIN_PASSWORD:-}
      GALLERY_SESSION_SECRET: ${GALLERY_SESSION_SECRET:-}
    restart: unless-stopped
